name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Linter
    uses: samjuk/github-actions/.github/workflows/magento2-test-lint.yaml@master

  static:
    name: Static Analysis
    uses: samjuk/github-actions/.github/workflows/magento2-test-static.yaml@master
    needs: lint

  phpunit-tests-ghas:
    name: PHPUnit Tests (GHAS)
    # TEMPORARY: pointed at test-github-actions to prove magento2-test-phpunit-module-ghas
    # against a real module before promoting it to prod (samjuk/github-actions).
    uses: samjuk/test-github-actions/.github/workflows/magento2-test-phpunit-module-ghas.yaml@master
    needs: static
    with:
      magento_version: ${{ matrix.magento_version }}
      run_unit_tests: true
      run_integration_tests: true
    strategy:
      fail-fast: false
      matrix:
        magento_version:
          - '2.4.8-p3'
          - '2.4.7-p8'
          - '2.4.6-p13'
          - '2.4.4-p13'
